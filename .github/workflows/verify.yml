name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: 'true'
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm backup:verify
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: lessonledger
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: lessonledger_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lessonledger -d lessonledger_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lessonledger:ci-disposable@localhost:5432/lessonledger_test
      TEST_DATABASE_URL: postgres://lessonledger:ci-disposable@localhost:5432/lessonledger_test
      DEMO_MODE: 'true'
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Back up with the matching PostgreSQL tools
        run: docker exec "${{ job.services.postgres.id }}" pg_dump -U lessonledger -d lessonledger_test --format=custom --file=/tmp/ledger-backup.dump
      - name: Create the disposable restore database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U lessonledger lessonledger_restore
      - name: Restore the PostgreSQL backup
        run: docker exec "${{ job.services.postgres.id }}" pg_restore -U lessonledger --dbname=lessonledger_restore --exit-on-error /tmp/ledger-backup.dump
      - name: Compare restored entity counts
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for table in workspaces courses lessons lesson_versions sources findings; do
            source_count=$(docker exec "$POSTGRES_CONTAINER" psql -U lessonledger -d lessonledger_test -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM $table")
            restored_count=$(docker exec "$POSTGRES_CONTAINER" psql -U lessonledger -d lessonledger_restore -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM $table")
            test "$source_count" = "$restored_count"
            echo "$table: $restored_count records restored"
          done
